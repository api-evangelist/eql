aid: eql
name: EQL
description: >-
  EQL is the infrastructure behind fair launches for high-demand, limited-supply
  products — sneakers, collectibles, art, coins, alcohol, trading cards, and
  brand collaborations. Every EQL launch is certified Run Fair®, combining bot
  mitigation, resilient infrastructure, and fair allocation to put products in
  the hands of genuine fans instead of bots and resellers. The platform serves
  brands and retailers who run launches (including a native Shopify app) and the
  fans who enter for a shot at products, providing queue-free entry, real-time
  launch data, payment capture, audience/allocation controls, and secondary-sale
  opportunities. Brands running launches on EQL include Nike, Crocs, Funko, Foot
  Locker, Undefeated, and Stanley. EQL is based in Melbourne, Australia.
